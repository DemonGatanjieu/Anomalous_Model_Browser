name: 提建议 / Suggestion
description: 想要的功能、哪里不顺手、希望往什么方向发展 / A feature you want, something awkward, where the plugin should go
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 你希望有什么？ / What would you like?
      description: 随便写，一两句话就行，中文英文都可以。 / Anything goes; a sentence or two is enough, in any language.
      placeholder: 比如：希望素材库能按标签筛选。 / e.g. Filter the material library by tag.
    validations:
      required: true
