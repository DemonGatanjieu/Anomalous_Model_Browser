name: 报告问题 / Bug report
description: 哪里坏了、报错了，或者和你想的不一样 / Something broke or did not do what you expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 遇到了什么问题？ / What went wrong?
      description: 一两句话就行，中文英文都可以。 / A sentence or two is enough, in any language.
      placeholder: 比如：在模型页点扫描，进度停在 30% 就不动了。 / e.g. The scan on the Models page stops at 30%.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: 截图或报错（可选） / Screenshots or errors (optional)
      description: 截图可以直接拖进来。 / Drop screenshots here.
  - type: textarea
    id: environment
    attributes:
      label: 环境信息（可选） / Environment (optional)
      description: 在插件里点 设置 → 帮助与反馈 → 复制诊断信息，粘贴到这里。 / In the plugin, Settings → Help and feedback → Copy diagnostics, then paste here.
      render: text
